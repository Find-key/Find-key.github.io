<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>写作台 · 0xFindkey</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="/" aria-label="写作台首页">
				<span class="wordmark">0x<i>Findkey</i></span>
				<span class="stamp">writing desk</span>
			</a>

			<div class="topbar-right">
				<span class="state" id="status" role="status" aria-live="polite"></span>
				<button class="ghost" id="new">＋ 新建</button>
				<span class="kbd-hint">⌘S 保存</span>
			</div>
		</header>

		<div class="shell">
			<aside class="rail">
				<div class="search">
					<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.3">
						<circle cx="7" cy="7" r="4.4" /><path d="M10.4 10.4 14 14" stroke-linecap="round" />
					</svg>
					<input id="search" type="search" placeholder="搜索标题、标签" autocomplete="off" />
				</div>

				<div class="chips" id="chips"></div>

				<ul class="list" id="list"></ul>

				<div class="rail-foot">
					<div class="cats" id="cats"></div>
					<form class="cat-add" id="catForm">
						<input id="cSlug" placeholder="slug" />
						<input id="cName" placeholder="显示名" />
						<button type="submit">加</button>
					</form>

					<details class="trash">
						<summary>回收站<span id="trashCount"></span></summary>
						<div id="trashList"></div>
					</details>
				</div>
			</aside>

			<main class="doc">
				<div class="doc-inner">
					<input id="title" class="doc-title" placeholder="无标题" aria-label="标题" />
					<input id="description" class="doc-sub" placeholder="一句话摘要（列表与 SEO 会用）" aria-label="摘要" />

					<div class="meta">
						<label class="field">
							<span>分类</span>
							<select id="category"></select>
						</label>
						<label class="field">
							<span>日期</span>
							<input id="pubDate" type="date" />
						</label>
						<label class="field grow">
							<span>标签</span>
							<input id="tags" placeholder="stack, ret2text" />
						</label>
						<label class="field">
							<span>文件</span>
							<input id="slug" placeholder="按标题生成" />
						</label>
						<label class="check">
							<input id="draft" type="checkbox" />
							<span>草稿</span>
						</label>
					</div>

					<hr class="rule" />

					<textarea
						id="body"
						class="doc-body"
						spellcheck="false"
						aria-label="正文"
						placeholder="## 环境&#10;&#10;从二级标题开始写，正文用 Markdown。"></textarea>
				</div>

				<div class="dock">
					<div class="dock-left">
						<button class="primary" id="save">保存</button>
						<button class="ghost" id="preview">预览</button>
						<button class="ghost danger" id="del">删除</button>
					</div>
					<div class="dock-right">
						<span class="count" id="wc"></span>
					</div>
				</div>
			</main>
		</div>

		<div class="toast" id="toast" role="status" aria-live="polite">
			<span id="toastText"></span>
			<button id="toastAction" hidden></button>
		</div>

		<div class="modal" id="modal" hidden>
			<div class="modal-card" role="dialog" aria-modal="true">
				<p id="modalText"></p>
				<div class="modal-actions">
					<button class="ghost" id="modalCancel">取消</button>
					<button class="primary" id="modalOk">确定</button>
				</div>
			</div>
		</div>

		<script src="/app.js" type="module"></script>
	</body>
</html>
