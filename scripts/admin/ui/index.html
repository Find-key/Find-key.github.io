<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>写作 · 0xFindkey</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body data-view="list">
		<header class="sitebar">
			<a class="brand" href="#/">0x<i>Findkey</i> <span class="slash">/</span> 写作</a>
			<span class="state" id="status" role="status" aria-live="polite"></span>
			<nav class="sitebar-nav">
				<a href="#/" data-nav="list">文章</a>
				<a href="#/categories" data-nav="categories">分类</a>
				<a href="#/trash" data-nav="trash">回收站</a>
				<a class="new" href="#/edit/new">＋ 新建</a>
			</nav>
		</header>

		<!-- ① 文章：按分类分组，像站点的归档页 -->
		<section class="view" id="view-list">
			<div class="page">
				<div class="page-top">
					<h1>文章</h1>
					<span class="count" id="totalCount"></span>
				</div>
				<div class="search">
					<input id="search" type="search" placeholder="搜索标题 / 标签 / 文件名　⌘K" autocomplete="off" />
				</div>
				<div id="groups"></div>
				<p class="empty" id="listEmpty" hidden>没有匹配的文章。</p>
			</div>
		</section>

		<!-- ② 编辑：像站点里的文章页 -->
		<section class="view" id="view-edit" hidden>
			<div class="editbar">
				<a class="back" href="#/">← 文章</a>
				<span class="edit-file" id="editFile"></span>
				<div class="editbar-right">
					<button class="quiet" id="metaToggle" aria-expanded="false">信息</button>
					<button class="quiet danger" id="del">删除</button>
					<button class="primary" id="save">保存</button>
				</div>
			</div>

			<article class="paper">
				<div class="meta" id="meta" hidden>
					<label class="field">
						<span>分类</span>
						<select id="category"></select>
					</label>
					<label class="field">
						<span>日期</span>
						<input id="pubDate" type="date" />
					</label>
					<label class="field">
						<span>文件</span>
						<input id="slug" placeholder="按标题生成" />
					</label>
					<label class="field">
						<span>标签</span>
						<input id="tags" placeholder="stack, ret2text" />
					</label>
					<label class="check">
						<input id="draft" type="checkbox" />
						<span>草稿</span>
					</label>
					<label class="field wide">
						<span>摘要</span>
						<input id="description" placeholder="一句话摘要" />
					</label>
				</div>

				<input id="title" class="doc-title" placeholder="无标题" aria-label="标题" />
				<textarea
					id="body"
					class="doc-body"
					spellcheck="false"
					aria-label="正文"
					placeholder="## 环境&#10;&#10;从二级标题开始写，正文用 Markdown。"></textarea>
				<footer class="paper-foot">
					<span id="wc"></span>
					<a id="preview" href="#" target="_blank" rel="noopener">在站点里打开 ↗</a>
				</footer>
			</article>
		</section>

		<!-- ③ 分类 -->
		<section class="view" id="view-categories" hidden>
			<div class="page">
				<div class="page-top">
					<h1>分类</h1>
					<span class="count" id="catTotal"></span>
				</div>
				<p class="hint" style="margin: -6px 0 26px">
					描述会显示在首页该分类的标题下面。点一行直接改，失焦保存；还有文章的分类不能删。
				</p>
				<div id="catRows"></div>
				<form class="add-cat" id="catForm">
					<input id="cSlug" placeholder="slug（小写英文）" />
					<input id="cName" placeholder="显示名" />
					<input id="cDesc" placeholder="描述（可留空）" />
					<button type="submit" class="primary">添加</button>
				</form>
			</div>
		</section>

		<!-- ④ 回收站 -->
		<section class="view" id="view-trash" hidden>
			<div class="page">
				<div class="page-top">
					<h1>回收站</h1>
					<span class="count" id="trashTotal"></span>
				</div>
				<p class="hint" style="margin: -6px 0 26px">
					删掉的文章先放这里，恢复时若重名会自动加 -restored。
				</p>
				<ul class="trash-list" id="trashList"></ul>
			</div>
		</section>

		<div class="toast" id="toast" role="status" aria-live="polite">
			<span id="toastText"></span>
			<button id="toastAction" hidden></button>
		</div>

		<div class="modal" id="modal" hidden>
			<div class="modal-card" role="dialog" aria-modal="true">
				<p id="modalText"></p>
				<div class="modal-actions">
					<button class="quiet" id="modalCancel">取消</button>
					<button class="primary" id="modalOk">确定</button>
				</div>
			</div>
		</div>

		<script src="/app.js" type="module"></script>
	</body>
</html>
