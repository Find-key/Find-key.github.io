<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>写作台 · 0xFindkey</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<header>
			<span class="mark">0x<i>Findkey</i></span>
			<span class="tag">writing desk</span>
			<span class="status" id="status"></span>
			<span class="note">只在本机运行 · 直接写仓库里的文件 · 完事记得 commit</span>
		</header>

		<main>
			<aside>
				<div class="label">
					<span>文章</span>
					<button class="add" id="new">+ 新建</button>
				</div>
				<ul id="list"></ul>

				<div class="cats-block">
					<div class="label"><span>分类</span></div>
					<div id="cats"></div>
					<div class="cat-add">
						<input id="cSlug" placeholder="slug（小写英文）" />
						<input id="cName" placeholder="显示名" />
						<button id="cAdd">加</button>
					</div>
					<details class="trash" id="trashBox">
						<summary>回收站 <span id="trashCount"></span></summary>
						<div id="trashList"></div>
					</details>
					<p class="hint">改分类会重写 consts.ts 并重启 dev。<br />⌘/Ctrl + S 保存。</p>
				</div>
			</aside>

			<section class="editor">
				<div class="row"><label>标题</label><input id="title" placeholder="文章标题" /></div>
				<div class="row">
					<label>摘要</label><input id="description" placeholder="一句话说清写了什么（会出现在列表和 SEO）" />
				</div>
				<div class="row"><label>分类</label><select id="category"></select></div>
				<div class="row"><label>日期</label><input id="pubDate" type="date" /></div>
				<div class="row">
					<label>标签</label><input id="tags" placeholder="逗号分隔，小写英文：stack, ret2text" />
				</div>
				<div class="row"><label>文件名</label><input id="slug" placeholder="留空按标题生成" /></div>
				<div class="row">
					<label>草稿</label>
					<label class="check"><input id="draft" type="checkbox" /> 只在本地可见</label>
				</div>
				<div class="row col">
					<label>正文 · Markdown，从 ## 开始 <span id="wc" class="wc"></span></label>
					<textarea id="body" placeholder="## 环境&#10;&#10;..."></textarea>
				</div>
				<div class="actions">
					<button class="primary" id="save">保存</button>
					<button id="preview">打开预览</button>
					<button class="danger" id="del">删除</button>
				</div>
			</section>
		</main>

		<div class="toast" id="toast" role="status" aria-live="polite">
			<span id="toastText"></span>
			<button id="toastAction" hidden></button>
		</div>

		<div class="modal" id="modal" hidden>
			<div class="modal-card">
				<p id="modalText"></p>
				<div class="modal-actions">
					<button id="modalCancel">取消</button>
					<button class="primary" id="modalOk">确定</button>
				</div>
			</div>
		</div>

		<script src="/app.js" type="module"></script>
	</body>
</html>
